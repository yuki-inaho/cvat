services:
  nuclio:
    container_name: nuclio
    image: quay.io/nuclio/dashboard:1.15.9-amd64
    restart: always
    networks:
      - cvat
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      http_proxy:
      https_proxy:
      no_proxy: ${no_proxy:-}
      NUCLIO_CHECK_FUNCTION_CONTAINERS_HEALTHINESS: 'true'
      NUCLIO_DASHBOARD_DEFAULT_FUNCTION_MOUNT_MODE: 'volume'
    logging:
      driver: "json-file"
      options:
        max-size: 100m
        max-file: "3"

  cvat_server:
    environment:
      CVAT_SERVERLESS: 1
      # Local Docker on this machine cannot reach Nuclio function node ports
      # through host.docker.internal from inside cvat_server. Invoke via the
      # Nuclio dashboard service on the compose network instead.
      CVAT_NUCLIO_INVOKE_METHOD: dashboard
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cvat_worker_annotation:
    environment:
      CVAT_NUCLIO_INVOKE_METHOD: dashboard
    extra_hosts:
      - "host.docker.internal:host-gateway"
