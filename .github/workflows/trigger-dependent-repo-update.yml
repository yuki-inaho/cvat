name: Trigger dependent repo update workflow

on:
  workflow_dispatch:
  push:
    branches: [ develop ]

jobs:
  trigger:
    runs-on: ubuntu-latest
    env:
      CVAT_BOT_APP_ID: ${{ secrets.CVAT_BOT_APP_ID }}
      CVAT_BOT_PRIVATE_KEY: ${{ secrets.CVAT_BOT_PRIVATE_KEY }}
      CVAT_DEPENDENT_REPO: ${{ secrets.CVAT_DEPENDENT_REPO }}
    steps:
      - name: Skip when dependent repository secrets are unavailable
        if: ${{ env.CVAT_BOT_APP_ID == '' || env.CVAT_BOT_PRIVATE_KEY == '' || env.CVAT_DEPENDENT_REPO == '' }}
        run: |
          echo "Skipping dependent repository update because CVAT_BOT_APP_ID, CVAT_BOT_PRIVATE_KEY, or CVAT_DEPENDENT_REPO is not configured."

      - name: Generate authentication token
        if: ${{ env.CVAT_BOT_APP_ID != '' && env.CVAT_BOT_PRIVATE_KEY != '' && env.CVAT_DEPENDENT_REPO != '' }}
        id: gen-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ env.CVAT_BOT_APP_ID }}
          private-key: ${{ env.CVAT_BOT_PRIVATE_KEY }}
          repositories: ${{ env.CVAT_DEPENDENT_REPO }}

      - name: Trigger private repository workflow
        if: ${{ env.CVAT_BOT_APP_ID != '' && env.CVAT_BOT_PRIVATE_KEY != '' && env.CVAT_DEPENDENT_REPO != '' }}
        env:
          GH_TOKEN: "${{ steps.gen-token.outputs.token }}"
          CVAT_DEPENDENT_REPO: "${{ env.CVAT_DEPENDENT_REPO }}"
        run: |
          gh api \
            --method POST \
            "/repos/cvat-ai/${CVAT_DEPENDENT_REPO}/dispatches" \
            -f 'event_type=upstream_updated' \
            -F "client_payload[triggeredBy]=${{ github.repository }}" \
            -F "client_payload[commitSha]=${{ github.sha }}" \
            -F "client_payload[branch]=${{ github.ref }}"
